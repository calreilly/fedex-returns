<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FedEx Return Labels</title>
<meta name="description" content="Import return requests and generate FedEx return labels and pickups.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1020;--card:#1a1b33;--line:#2c2e52;--text:#e8e9ff;--mut:#8b8fb8;
--a:#8b5cf6;--b:#4d148c;--ok:#34d399;--err:#f87171;--warn:#fbbf24}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,sans-serif;background:radial-gradient(1200px 600px at 10% -10%,#2a1857,transparent),var(--bg);color:var(--text);min-height:100vh}
header{padding:28px 40px;display:flex;align-items:center;gap:16px}
h1{margin:0;font-size:24px;background:linear-gradient(90deg,#c4b5fd,#ff8a3d);-webkit-background-clip:text;color:transparent}
.badge{font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--warn)}
main{padding:0 40px 60px;max-width:1300px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:22px;box-shadow:0 10px 30px #0006}
h2{margin:0 0 14px;font-size:16px}
#drop{border:2px dashed var(--line);border-radius:14px;padding:34px;text-align:center;color:var(--mut);cursor:pointer;transition:.2s}
#drop:hover,#drop.over{border-color:var(--a);background:#8b5cf610;color:var(--text)}
button{background:linear-gradient(135deg,var(--a),var(--b));color:#fff;border:0;border-radius:10px;padding:10px 18px;font:600 14px Inter;cursor:pointer;transition:.15s}
button:hover{transform:translateY(-1px);filter:brightness(1.12)}button:disabled{opacity:.4;cursor:default;transform:none}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--mut);font-weight:500;padding:8px;border-bottom:1px solid var(--line)}
td{padding:6px 8px;border-bottom:1px solid #2c2e5255;vertical-align:middle}
td input,td select{width:100%;background:#12132a;border:1px solid var(--line);border-radius:6px;color:var(--text);padding:6px;font:13px Inter}
td input[type=number]{width:60px}
.st{font-size:12px}.ok{color:var(--ok)}.er{color:var(--err)}.wa{color:var(--warn)}
.bar{display:flex;gap:10px;margin-top:14px;align-items:center}
a{color:#c4b5fd}
</style>
</head>
<body>
<header><h1>FedEx Return Labels</h1><span class="badge" id="mode"></span></header>
<main>
<section class="card">
  <h2>1. Import Wufoo CSV</h2>
  <div id="drop">Drop CSV here or click to choose<input id="file" type="file" accept=".csv" hidden></div>
</section>
<section class="card" id="review" hidden>
  <h2>2. Review &amp; edit</h2>
  <table><thead><tr><th></th><th>RMA</th><th>Name</th><th>Email</th><th>Phone</th><th>Boxes</th><th>Method</th>
  <th>Street</th><th>City</th><th>ST</th><th>ZIP</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table>
  <div class="bar"><button id="go">Generate selected</button><span id="summary" class="st"></span></div>
</section>
<section class="card">
  <h2>History</h2>
  <table><thead><tr><th>RMA</th><th>Name</th><th>Boxes</th><th>Method</th><th>Status</th><th>Tracking</th><th>Pickup #</th><th>Labels</th></tr></thead>
  <tbody id="hist"></tbody></table>
</section>
</main>
<script>
const $=s=>document.querySelector(s);
const F=['rma','name','email','phone','boxes','method','street','city','state','zip'];
let rows=[];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
fetch('/api/config').then(r=>r.json()).then(c=>{$('#mode').textContent=c.mock?'MOCK MODE (no real labels)':'FedEx '+c.env;});
$('#drop').onclick=()=>$('#file').click();
$('#drop').ondragover=e=>{e.preventDefault();$('#drop').classList.add('over')};
$('#drop').ondragleave=()=>$('#drop').classList.remove('over');
$('#drop').ondrop=e=>{e.preventDefault();upload(e.dataTransfer.files[0])};
$('#file').onchange=e=>upload(e.target.files[0]);
async function upload(f){
  const fd=new FormData();fd.append('file',f);
  const j=await (await fetch('/api/import',{method:'POST',body:fd})).json();
  rows=j.rows;render();
}
function render(){
  $('#review').hidden=false;
  $('#rows').innerHTML=rows.map((r,i)=>`<tr data-i="${i}">
   <td><input type="checkbox" class="sel" ${r.errors.length||r.already_done?'':'checked'}></td>
   ${F.map(k=>k==='method'?`<td><select data-k="method"><option value="pickup" ${r.method==='pickup'?'selected':''}>Pickup</option><option value="dropoff" ${r.method==='dropoff'?'selected':''}>Drop-off</option></select></td>`
     :`<td><input data-k="${k}" value="${esc(r[k])}" ${k==='boxes'?'type="number" min="1"':''}></td>`).join('')}
   <td class="st ${r.errors.length?'er':r.already_done?'wa':''}" id="s${i}">${r.errors.length?esc(r.errors.join(', ')):r.already_done?'Already done':'Ready'}</td></tr>`).join('');
  document.querySelectorAll('#rows [data-k]').forEach(el=>el.onchange=()=>{
    const i=el.closest('tr').dataset.i;rows[i][el.dataset.k]=el.dataset.k==='boxes'?+el.value:el.value;});
}
$('#go').onclick=async()=>{
  $('#go').disabled=true;let ok=0,bad=0;
  for(const tr of document.querySelectorAll('#rows tr')){
    if(!tr.querySelector('.sel').checked)continue;
    const i=tr.dataset.i,r=rows[i],s=$('#s'+i);
    let force=false;
    if(r.already_done&&!(force=confirm(`RMA ${r.rma} already has labels. Create duplicates?`)))continue;
    s.className='st';s.textContent='Working…';
    const res=await fetch('/api/process?force='+force,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...r,boxes:+r.boxes})});
    const j=await res.json();
    if(res.ok){ok++;s.className='st ok';s.textContent=`Done (${j.tracking.length} labels${j.pickup?', pickup '+j.pickup:''})`}
    else{bad++;s.className='st er';s.textContent=j.detail}
  }
  $('#summary').textContent=`${ok} succeeded, ${bad} failed`;$('#go').disabled=false;loadHist();
};
async function loadHist(){
  const h=await (await fetch('/api/history')).json();
  $('#hist').innerHTML=h.map(r=>`<tr><td>${esc(r.rma)}</td><td>${esc(r.name)}</td><td>${r.boxes}</td><td>${r.method}</td>
  <td class="${r.status==='done'?'ok':'er'}">${r.status}${r.error?': '+esc(r.error):''}</td><td>${r.tracking.map(esc).join('<br>')}</td>
  <td>${esc(r.pickup_confirmation||'')}</td><td><a href="/api/labels/${encodeURIComponent(r.rma)}.zip">Download</a></td></tr>`).join('');
}
loadHist();
</script>
</body>
</html>
